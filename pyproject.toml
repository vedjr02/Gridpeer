[project]
name = "gridpeer"
version = "0.1.0"
description = "AI-driven peer-to-peer energy trading marketplace simulation"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "pandas>=2.2",
    "numpy>=1.26",
    "lightgbm>=4.3",
    "prophet>=1.1",
    "pettingzoo>=1.24",
    "stable-baselines3>=2.3",
    "gymnasium>=0.29",
    "streamlit>=1.33",
    "duckdb>=0.10",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1",
    "hypothesis>=6.100",
    "ruff>=0.4",
    "mypy>=1.9",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# This project has no single top-level package matching its name (it's 5
# sibling packages: shared, data, simulation, agents, forecasting, dashboard), so
# setuptools' flat-layout auto-discovery can't guess correctly on its own —
# without this, `pip install -e .` fails with "Multiple top-level packages
# discovered in a flat-layout" on every machine, deterministically.
# `data` IS included: it ships the synthetic household generator that the
# orchestrator imports, so it has to resolve outside the repo root too (e.g.
# under `streamlit run`, which puts the script's own directory on sys.path).
# `tests` stays excluded — it isn't imported by any module.
[tool.setuptools.packages.find]
include = [
    "shared", "shared.*",
    "data", "data.*",
    "simulation", "simulation.*",
    "agents", "agents.*",
    "forecasting", "forecasting.*",
    "dashboard", "dashboard.*",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

# `shared/schemas.py` has failed lint since the repo was bootstrapped, which kept
# CI red on every branch and blocked merges for everyone. The violations are
# cosmetic — long Field(description=...) strings, and the `str, Enum` mixin that
# ruff would rather see as `StrEnum`.
#
# They are silenced here rather than fixed in place because CONTRIBUTING.md asks
# for sign-off from all four of us before `shared/schemas.py` changes at all, and
# an earlier attempt to reformat it (#5) was reverted (#10) within the hour. This
# keeps that file byte-for-byte untouched, so nothing here needs the schema-change
# process, and unblocks CI today.
#
# This is a stopgap, not a verdict. Drop it once the team agrees on the real fix:
# wrapping the long lines is harmless, but switching to `StrEnum` is a behaviour
# change — `str(OrderSide.BUY)` becomes "buy" instead of "OrderSide.BUY" — so that
# one needs a decision, not a reformat.
[tool.ruff.lint.per-file-ignores]
"shared/schemas.py" = ["E501", "UP042"]

[tool.pytest.ini_options]
testpaths = ["tests", "shared", "simulation", "agents", "forecasting", "dashboard", "data"]

